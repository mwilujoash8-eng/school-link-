    <script>
      // 1. Self-correct GitHub Pages sub-directory URL if missing trailing slash
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. SPA Route Restoration from static 404 redirect (?p=...)
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var redirectPath = params.get('p');
          if (redirectPath) {
            var rawQuery = params.get('q');
            var cleanQuery = rawQuery ? '?' + decodeURIComponent(rawQuery) : '';
            var targetUrl = window.location.pathname.replace(/\/$/, '') + decodeURIComponent(redirectPath) + cleanQuery + window.location.hash;
            window.history.replaceState(null, '', targetUrl);
          }
        } catch (e) {
          console.warn('SPA route restore notice:', e);
        }
      })();
    </script>
